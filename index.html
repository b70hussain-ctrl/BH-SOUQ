<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BH SOUQ | سوق البحرين</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0b1329; color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- نافذة اختيار العملة عند الدخول -->
    <div id="currency-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
        <div class="bg-[#111c38] border border-cyan-500/30 p-6 sm:p-8 rounded-2xl shadow-2xl max-w-sm sm:max-w-md w-full text-center">
            <div class="w-24 h-24 sm:w-28 sm:h-28 mx-auto mb-4 rounded-2xl overflow-hidden border-2 border-cyan-400 shadow-lg bg-gray-900/90 flex items-center justify-center p-2">
                <img src="IMG_0637.PNG" alt="BH SOUQ Logo" class="w-full h-full object-contain">
            </div>
            <h2 class="text-xl sm:text-2xl font-bold text-cyan-400 mb-2">مرحباً بك في BH SOUQ</h2>
            <p class="text-gray-300 mb-6 text-xs sm:text-sm">الرجاء اختيار العملة المفضلة لديك لعرض الأسعار:</p>
            <div class="grid grid-cols-2 gap-3 sm:gap-4 mb-2">
                <button onclick="setCurrency('BHD', 'د.ب')" class="p-2.5 sm:p-3 bg-cyan-600/20 hover:bg-cyan-600 border border-cyan-500/50 rounded-xl font-bold transition text-xs sm:text-sm text-cyan-300 hover:text-white">دينار بحريني (BHD)</button>
                <button onclick="setCurrency('SAR', 'ر.س')" class="p-2.5 sm:p-3 bg-cyan-600/20 hover:bg-cyan-600 border border-cyan-500/50 rounded-xl font-bold transition text-xs sm:text-sm text-cyan-300 hover:text-white">ريال سعودي (SAR)</button>
                <button onclick="setCurrency('AED', 'د.إ')" class="p-2.5 sm:p-3 bg-cyan-600/20 hover:bg-cyan-600 border border-cyan-500/50 rounded-xl font-bold transition text-xs sm:text-sm text-cyan-300 hover:text-white">درهم إماراتي (AED)</button>
                <button onclick="setCurrency('USD', '$')" class="p-2.5 sm:p-3 bg-cyan-600/20 hover:bg-cyan-600 border border-cyan-500/50 rounded-xl font-bold transition text-xs sm:text-sm text-cyan-300 hover:text-white">دولار أمريكي (USD)</button>
            </div>
        </div>
    </div>

    <!-- الهيدر الرئيسي -->
    <header class="bg-[#111c38]/90 backdrop-blur-md border-b border-gray-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-3 sm:px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2 sm:gap-3">
                <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl overflow-hidden border border-cyan-400 bg-gray-900 flex items-center justify-center p-1 flex-shrink-0">
                    <img src="IMG_0637.PNG" alt="Logo" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="text-base sm:text-xl font-black text-cyan-400 tracking-wider">BH SOUQ</h1>
                    <span class="text-[10px] sm:text-xs text-orange-400 font-semibold">سوق البحرين الرقمي</span>
                </div>
            </div>
            <div class="flex items-center gap-2 sm:gap-4">
                <button onclick="openCartModal()" class="relative bg-cyan-600 hover:bg-cyan-500 text-white px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl font-bold text-xs sm:text-sm flex items-center gap-1.5 transition shadow-lg shadow-cyan-500/20">
                    🛒 السلة <span id="cart-count" class="bg-orange-500 text-white text-[10px] px-1.5 py-0.2 rounded-full">0</span>
                </button>
                <div class="text-xs sm:text-sm bg-gray-800/80 px-2.5 sm:px-3 py-1.5 rounded-xl border border-gray-700 text-gray-300">
                    <span id="current-currency-label" class="text-cyan-400 font-bold">BHD</span>
                </div>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-7xl mx-auto px-3 sm:px-4 py-6 flex-grow w-full">
        <!-- شريط الأقسام -->
        <div class="flex justify-center gap-2 sm:gap-4 mb-6 sm:mb-8 overflow-x-auto py-1">
            <button onclick="filterProducts('all')" id="btn-all" class="px-4 sm:px-6 py-2 rounded-xl font-bold bg-cyan-600 text-white text-xs sm:text-sm shadow-lg transition whitespace-nowrap">جميع المنتجات</button>
            <button onclick="filterProducts('digital')" id="btn-digital" class="px-4 sm:px-6 py-2 rounded-xl font-bold bg-gray-800 text-gray-300 hover:bg-gray-700 text-xs sm:text-sm transition whitespace-nowrap">الاشتراكات الرقمية</button>
            <button onclick="filterProducts('physical')" id="btn-physical" class="px-4 sm:px-6 py-2 rounded-xl font-bold bg-gray-800 text-gray-300 hover:bg-gray-700 text-xs sm:text-sm transition whitespace-nowrap">المنتجات العادية</button>
        </div>

        <!-- شبكة المنتجات -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
            <!-- المنتجات ستظهر هنا ديناميكياً -->
        </div>
    </main>

    <!-- نافذة تكبير واستعراض المنتج (مع معرض الصور للماوس) -->
    <div id="product-zoom-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/95 backdrop-blur-md p-3 sm:p-4">
        <div class="relative max-w-3xl w-full bg-[#111c38] border border-cyan-500/40 rounded-2xl overflow-hidden shadow-2xl p-4 sm:p-6 flex flex-col md:flex-row gap-4 sm:gap-6 max-h-[90vh] overflow-y-auto">
            <button onclick="closeZoomModal()" class="absolute top-3 left-3 text-gray-400 hover:text-white bg-gray-800/80 w-8 h-8 sm:w-10 sm:h-10 rounded-full flex items-center justify-center font-bold text-sm sm:text-lg z-10 transition">✕</button>
            <div class="w-full md:w-1/2 flex flex-col gap-3">
                <div class="h-56 sm:h-72 bg-gray-900 rounded-xl overflow-hidden flex items-center justify-center border border-gray-800 p-2">
                    <img id="zoom-modal-img" src="" alt="Zoomed Product" class="w-full h-full object-contain">
                </div>
                <!-- معرض الصور المصغرة -->
                <div id="zoom-thumbnails" class="flex gap-2 justify-center overflow-x-auto py-1"></div>
            </div>
            <div class="w-full md:w-1/2 flex flex-col justify-between">
                <div>
                    <span id="zoom-modal-cat" class="text-[10px] sm:text-xs font-black bg-cyan-500/20 text-cyan-400 px-3 py-1 rounded-full inline-block mb-2"></span>
                    <h3 id="zoom-modal-title" class="text-xl sm:text-2xl font-bold text-white mb-2 sm:mb-3"></h3>
                    <p id="zoom-modal-desc" class="text-gray-300 text-xs sm:text-sm mb-4 leading-relaxed whitespace-pre-line"></p>
                </div>
                <div>
                    <div class="flex items-center gap-3 mb-4">
                        <div id="zoom-modal-price" class="text-xl sm:text-2xl font-black text-cyan-400"></div>
                        <div id="zoom-modal-old-price" class="text-sm text-gray-400 line-through"></div>
                        <div id="zoom-modal-badge" class="bg-orange-500 text-white text-xs font-black px-2 py-0.5 rounded-lg"></div>
                    </div>
                    <div class="flex gap-2 sm:gap-3">
                        <button id="zoom-add-cart-btn" class="flex-1 bg-gray-800 hover:bg-gray-700 text-cyan-400 border border-cyan-500/30 py-2.5 sm:py-3 rounded-xl font-bold text-xs sm:text-sm transition">إضافة للسلة 🛒</button>
                        <button id="zoom-buy-btn" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white py-2.5 sm:py-3 rounded-xl font-bold text-xs sm:text-sm transition shadow-md shadow-cyan-600/20">اطلب الآن 🚀</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة إتمام الطلب (Checkout Modal) -->
    <div id="checkout-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-md p-3 sm:p-4">
        <div class="bg-[#111c38] border border-cyan-500/30 p-5 sm:p-6 rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg sm:text-xl font-bold text-cyan-400 mb-3 sm:mb-4 border-b border-gray-800 pb-2.5">إتمام الطلب</h3>
            <form id="checkout-form" onsubmit="submitOrder(event)" class="space-y-3 sm:space-y-4">
                <div id="dynamic-fields" class="space-y-3 sm:space-y-4"></div>
                <div class="flex gap-2.5 pt-3">
                    <button type="submit" class="flex-1 bg-green-600 hover:bg-green-500 text-white py-2.5 sm:py-3 rounded-xl font-bold text-xs sm:text-sm transition shadow-lg shadow-green-600/20">تأكيد وإرسال عبر الواتساب 📱</button>
                    <button type="button" onclick="closeCheckoutModal()" class="bg-gray-700 hover:bg-gray-600 text-gray-200 px-4 sm:px-5 py-2.5 sm:py-3 rounded-xl font-bold text-xs sm:text-sm transition">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <!-- نافذة السلة -->
    <div id="cart-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-md p-3 sm:p-4">
        <div class="bg-[#111c38] border border-cyan-500/30 p-5 sm:p-6 rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg sm:text-xl font-bold text-cyan-400 mb-3 sm:mb-4 border-b border-gray-800 pb-2.5">سلة المشتريات</h3>
            <div id="cart-items-list" class="space-y-2.5 mb-4 max-h-60 overflow-y-auto"></div>
            <div class="flex justify-between items-center font-bold text-base sm:text-lg mb-5 border-t border-gray-800 pt-3">
                <span>المجموع الكلي:</span>
                <span id="cart-total-price" class="text-cyan-400">0.000</span>
            </div>
            <div class="flex gap-2.5">
                <button onclick="checkoutCart()" class="flex-1 bg-green-600 hover:bg-green-500 text-white py-2.5 sm:py-3 rounded-xl font-bold text-xs sm:text-sm transition shadow-lg shadow-green-600/20">تأكيد طلبات السلة عبر الواتساب 📱</button>
                <button onclick="closeCartModal()" class="bg-gray-700 hover:bg-gray-600 text-gray-200 px-4 sm:px-5 py-2.5 sm:py-3 rounded-xl font-bold text-xs sm:text-sm transition">إغلاق</button>
            </div>
        </div>
    </div>

        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="text-cyan-400 font-bold">
                BH SOUQ © 2026 - جميع حقوق الطبع والنشر محفوظة
            </div>
            <div class="flex flex-wrap items-center justify-center gap-3">
                <!-- زر انستغرام بالأيقونة الأصلية ورابطك المحدد -->
                <a href="https://www.instagram.com/_bhsouq_?stkn=MWdpcm95bTU3aXRzbQ%3D%3D&utm_source=qr" target="_blank" class="flex items-center gap-2 text-white bg-gradient-to-r from-purple-600 via-pink-600 to-yellow-500 hover:opacity-90 transition font-semibold px-3.5 py-2 rounded-xl shadow-md text-xs sm:text-sm">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                    انستغرام الرسمي
                </a>
                <!-- زر تيك توك بالأيقونة الرسمية -->
                <a href="https://www.tiktok.com/@_k6k_?_r=1&_t=ZS-99e93d579xh" target="_blank" class="flex items-center gap-2 text-white bg-gray-900 hover:bg-black transition font-semibold px-3.5 py-2 rounded-xl border border-gray-700 shadow-md text-xs sm:text-sm">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
                    تيك توك الرسمي
                </a>
                <!-- زر الدعم الفني واتساب بالأيقونة الرسمية -->
                <a href="https://wa.me/97337054101" target="_blank" class="flex items-center gap-2 text-white bg-green-600 hover:bg-green-500 transition font-bold px-3.5 py-2 rounded-xl shadow-lg shadow-green-600/20 text-xs sm:text-sm">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>

        </div>
    </footer>

    <!-- سكربت الجافاسكريبت والمنطق البرمجي -->
    <script>
        const exchangeRates = {
            BHD: { rate: 1.0, symbol: 'د.ب' },
            SAR: { rate: 9.96, symbol: 'ر.س' },
            AED: { rate: 9.74, symbol: 'د.إ' },
            USD: { rate: 2.65, symbol: '$' }
        };

        let currentCurrency = 'BHD';
        let currentSymbol = 'د.ب';

        const products = [
            {
                id: 1,
                name: "GEMINI PRO - جيمني برو (اشتراك 12 شهر)",
                category: "digital",
                priceBHD: 2.900,
                oldPriceBHD: 6.500,
                discount: "خصم 55%",
                images: ["IMG_0639.PNG"],
                description: "👑 اشتراك خاص وعلى حسابك الشخصي وآمن ١٠٠٪؜\n🚀 أداء فائق السرعة والتميز!\n📊 تحليل بيانات متقدم ودقيق للغاية.\n🪄 توليد محتوى إبداعي وابتكاري بلا حدود.\n🌐 دعم لغات متعددة واحترافية عالية.\n✨ تفعيل فوري ومباشر على حسابك الخاص!"
            },
            {
                id: 2,
                name: "CANVA PRO - كانفا برو (اشتراك شهر)",
                category: "digital",
                priceBHD: 1.600,
                oldPriceBHD: 3.500,
                discount: "خصم 54%",
                images: ["IMG_0678.PNG"],
                description: "🎨 وصول كامل لكافة ميزات كانفا برو بلا حدود!\n📚 مكتبة قوالب وعناصر ضحمة وحصرية.\n✨ أدوات تصميم احترافية ومتقدمة.\n☁️ تحديثات مستمرة وحفظ سحابي آمن.\n🛡️ اشتراك صالح لمدة شهر بـ ضمان كامل المدة!"
            },
            {
                id: 3,
                name: "ATTACK SHARK X11 Mouse",
                category: "physical",
                priceBHD: 14.200,
                oldPriceBHD: 15.900,
                discount: "خصم 11%",
                images: ["IMG_0674.JPEG", "IMG_0675.PNG", "IMG_0676.PNG"],
                description: "🖱️ ماوس الألعاب الاحترافي الخارق ATTACK SHARK X11!\n🪶 وزن خارق الخفة 49 جرام فقط لسرعة حركة فائقة.\n🎯 مزود بمستشعر دقيق وعالي الأداء PAW3311.\n🔋 بطارية عملاقة تدوم حتى 130 ساعة من اللعب.\n⚡ اتصال ثلاثي الأوضاع (2.4G لاسلكي، بلوتوث 5.2، وسلكي Type-C).\n💡 يأتي مع قاعدة شحن RGB أنيقة ومميزة!"
            }
        ];

        let cart = [];
        let activeCheckoutItem = null;
        let isCartCheckout = false;

        function setCurrency(currencyKey, symbol) {
            currentCurrency = currencyKey;
            currentSymbol = symbol;
            document.getElementById('current-currency-label').innerText = currencyKey;
            document.getElementById('currency-modal').style.display = 'none';
            renderProducts();
        }

        function formatPrice(priceInBHD) {
            const converted = priceInBHD * exchangeRates[currentCurrency].rate;
            return `${converted.toFixed(3)} ${currentSymbol}`;
        }

        function renderProducts(filter = 'all') {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            ['all', 'digital', 'physical'].forEach(cat => {
                const btn = document.getElementById(`btn-${cat}`);
                if(cat === filter) {
                    btn.className = "px-4 sm:px-6 py-2 rounded-xl font-bold bg-cyan-600 text-white text-xs sm:text-sm shadow-lg transition whitespace-nowrap";
                } else {
                    btn.className = "px-4 sm:px-6 py-2 rounded-xl font-bold bg-gray-800 text-gray-300 hover:bg-gray-700 text-xs sm:text-sm transition whitespace-nowrap";
                }
            });

            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);

            filtered.forEach(product => {
                const card = document.createElement('div');
                card.className = "bg-[#111c38] border border-gray-800 rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between hover:border-cyan-500/50 transition group";
                
                const formattedDesc = product.description.replace(/\n/g, '<br>');

                card.innerHTML = `
                    <div>
                        <div class="relative overflow-hidden h-48 sm:h-56 bg-gray-900 cursor-pointer flex items-center justify-center p-2" onclick="openZoomModal(${product.id})">
                            <img src="${product.images[0]}" alt="${product.name}" class="w-full h-full object-contain group-hover:scale-105 transition duration-500">
                            <span class="absolute top-2.5 right-2.5 bg-cyan-500/90 text-gray-900 text-[10px] sm:text-xs font-black px-2.5 py-0.5 rounded-full backdrop-blur-sm z-10">
                                ${product.category === 'digital' ? '⚡ اشتراك رقمي' : '📦 منتج عادي'}
                            </span>
                            <span class="absolute top-2.5 left-2.5 bg-orange-500 text-white text-[10px] sm:text-xs font-black px-2.5 py-0.5 rounded-full z-10 animate-pulse">
                                🔥 ${product.discount}
                            </span>
                        </div>
                        <div class="p-4 sm:p-5">
                            <h3 class="text-base sm:text-lg font-bold text-white mb-2 cursor-pointer hover:text-cyan-400 transition" onclick="openZoomModal(${product.id})">${product.name}</h3>
                            <p class="text-gray-300 text-xs sm:text-sm mb-4 leading-relaxed">${formattedDesc}</p>
                        </div>
                    </div>
                    <div class="p-4 sm:p-5 pt-0 flex flex-col gap-3">
                        <div class="flex items-center gap-3">
                            <div class="text-lg sm:text-xl font-black text-cyan-400">${formatPrice(product.priceBHD)}</div>
                            <div class="text-xs sm:text-sm text-gray-400 line-through">${formatPrice(product.oldPriceBHD)}</div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="addToCart(${product.id})" class="flex-1 bg-gray-800 hover:bg-gray-700 text-cyan-400 border border-cyan-500/30 py-2 sm:py-2.5 rounded-xl font-bold text-xs sm:text-sm transition">إضافة للسلة 🛒</button>
                            <button onclick="openCheckout(${product.id})" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white py-2 sm:py-2.5 rounded-xl font-bold text-xs sm:text-sm transition shadow-md shadow-cyan-600/20">اطلب الآن 🚀</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterProducts(category) {
            renderProducts(category);
        }

        function openZoomModal(productId) {
            const product = products.find(p => p.id === productId);
            document.getElementById('zoom-modal-img').src = product.images[0];
            document.getElementById('zoom-modal-title').innerText = product.name;
            document.getElementById('zoom-modal-desc').innerText = product.description;
            document.getElementById('zoom-modal-cat').innerText = product.category === 'digital' ? '⚡ اشتراك رقمي' : '📦 منتج عادي';
            document.getElementById('zoom-modal-price').innerText = formatPrice(product.priceBHD);
            document.getElementById('zoom-modal-old-price').innerText = formatPrice(product.oldPriceBHD);
            document.getElementById('zoom-modal-badge').innerText = product.discount;

            const thumbsContainer = document.getElementById('zoom-thumbnails');
            thumbsContainer.innerHTML = '';
            if (product.images.length > 1) {
                product.images.forEach((imgSrc, idx) => {
                    const thumb = document.createElement('img');
                    thumb.src = imgSrc;
                    thumb.className = `w-14 h-14 object-contain rounded-lg border-2 cursor-pointer bg-gray-900 p-1 transition ${idx === 0 ? 'border-cyan-400' : 'border-gray-700 hover:border-gray-500'}`;
                    thumb.onclick = function() {
                        document.getElementById('zoom-modal-img').src = imgSrc;
                        Array.from(thumbsContainer.children).forEach(t => t.className = "w-14 h-14 object-contain rounded-lg border-2 cursor-pointer bg-gray-900 p-1 transition border-gray-700 hover:border-gray-500");
                        thumb.className = "w-14 h-14 object-contain rounded-lg border-2 cursor-pointer bg-gray-900 p-1 transition border-cyan-400";
                    };
                    thumbsContainer.appendChild(thumb);
                });
            }
            
            document.getElementById('zoom-add-cart-btn').onclick = function() {
                addToCart(product.id);
            };
            document.getElementById('zoom-buy-btn').onclick = function() {
                closeZoomModal();
                openCheckout(product.id);
            };

            document.getElementById('product-zoom-modal').style.display = 'flex';
        }

        function closeZoomModal() {
            document.getElementById('product-zoom-modal').style.display = 'none';
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            cart.push(product);
            updateCartCount();
            alert(`تمت إضافة "${product.name}" إلى السلة بنجاح! ✅`);
        }

        function updateCartCount() {
            document.getElementById('cart-count').innerText = cart.length;
        }

        function openCartModal() {
            if(cart.length === 0) {
                alert("سلة المشتريات فارغة حالياً! 🛒");
                return;
            }
            const list = document.getElementById('cart-items-list');
            list.innerHTML = '';
            let totalBHD = 0;

            cart.forEach((item, index) => {
                totalBHD += item.priceBHD;
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-gray-800/60 p-2.5 sm:p-3 rounded-xl border border-gray-700 text-xs sm:text-sm";
                div.innerHTML = `
                    <div>
                        <h4 class="font-bold text-white">${item.name}</h4>
                        <span class="text-xs text-cyan-400">${formatPrice(item.priceBHD)}</span>
                    </div>
                    <button onclick="removeFromCart(${index})" class="text-red-400 hover:text-red-300 text-xs font-bold px-2 py-1 bg-red-500/10 rounded-lg">حذف</button>
                `;
                list.appendChild(div);
            });

            document.getElementById('cart-total-price').innerText = formatPrice(totalBHD);
            document.getElementById('cart-modal').style.display = 'flex';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartCount();
            openCartModal();
        }

        function closeCartModal() {
            document.getElementById('cart-modal').style.display = 'none';
        }

        function openCheckout(productId) {
            const product = products.find(p => p.id === productId);
            activeCheckoutItem = product;
            isCartCheckout = false;
            setupCheckoutForm([product]);
        }

        function checkoutCart() {
            if(cart.length === 0) return;
            isCartCheckout = true;
            closeCartModal();
            setupCheckoutForm(cart);
        }

        function setupCheckoutForm(itemsList) {
            const container = document.getElementById('dynamic-fields');
            container.innerHTML = '';

            const hasPhysical = itemsList.some(item => item.category === 'physical');

            let formHTML = `<div class="bg-gray-800/40 p-2.5 sm:p-3 rounded-xl mb-3 border border-gray-700 text-xs text-gray-300">المنتجات المطلوبة: <span class="text-cyan-400 font-bold">${itemsList.map(i => i.name).join('، ')}</span></div>`;

            if(hasPhysical) {
                formHTML += `
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1">الاسم الكامل:</label>
                        <input type="text" id="cust-name" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 sm:px-4 py-2 text-xs sm:text-sm text-white focus:border-cyan-500 outline-none" placeholder="أدخل اسمك الكامل">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1">البريد الإلكتروني (يجب أن ينتهي بـ gmail.com):</label>
                        <input type="email" id="cust-email" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 sm:px-4 py-2 text-xs sm:text-sm text-white focus:border-cyan-500 outline-none" placeholder="example@gmail.com">
                    </div>
                    <div class="grid grid-cols-2 gap-2 sm:gap-3">
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">المنطقة:</label>
                            <input type="text" id="cust-region" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 sm:px-4 py-2 text-xs sm:text-sm text-white focus:border-cyan-500 outline-none" placeholder="مثال: المنامة">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-300 mb-1">رقم التواصل:</label>
                            <input type="tel" id="cust-phone" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 sm:px-4 py-2 text-xs sm:text-sm text-white focus:border-cyan-500 outline-none" placeholder="+973 ...">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1">العنوان التفصيلي:</label>
                        <textarea id="cust-address" required rows="2" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 sm:px-4 py-2 text-xs sm:text-sm text-white focus:border-cyan-500 outline-none" placeholder="رقم المجمع، رقم الشارع، رقم المنزل..."></textarea>
                    </div>
                `;
            } else {
                formHTML += `
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1">البريد الإلكتروني (يجب أن ينتهي بـ gmail.com):</label>
                        <input type="email" id="cust-email" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 sm:px-4 py-2 text-xs sm:text-sm text-white focus:border-cyan-500 outline-none" placeholder="example@gmail.com">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1">رقم التواصل:</label>
                        <input type="tel" id="cust-phone" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 sm:px-4 py-2 text-xs sm:text-sm text-white focus:border-cyan-500 outline-none" placeholder="+973 ...">
                    </div>
                `;
            }

            container.innerHTML = formHTML;
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function closeCheckoutModal() {
            document.getElementById('checkout-modal').style.display = 'none';
        }

        function submitOrder(event) {
            event.preventDefault();

            const emailInput = document.getElementById('cust-email').value.trim();
            if (!emailInput.endsWith('@gmail.com')) {
                alert("عذراً، يجب أن يكون البريد الإلكتروني بصيغة gmail.com حصراً! ❌");
                return;
            }

            const phone = document.getElementById('cust-phone').value.trim();
            const hasPhysical = isCartCheckout ? cart.some(i => i.category === 'physical') : activeCheckoutItem.category === 'physical';

            let addressText = "لا يوجد";

            if (hasPhysical) {
                const region = document.getElementById('cust-region').value.trim();
                const addressDetails = document.getElementById('cust-address').value.trim();
                addressText = `${region} - ${addressDetails}`;
            }

            const itemsToOrder = isCartCheckout ? cart : [activeCheckoutItem];
            let orderTypeNames = itemsToOrder.map(i => i.name).join('، ');

            let whatsappMessage = `نوع الطلب: ${orderTypeNames} %0a`;
            whatsappMessage += `الإيميل: ${emailInput} %0a`;
            whatsappMessage += `رقم التواصل: ${phone} %0a`;
            whatsappMessage += `العنوان: ${addressText}`;

            if(isCartCheckout) {
                cart = [];
                updateCartCount();
            }

            closeCheckoutModal();

            const whatsappUrl = `https://wa.me/97337054101?text=${whatsappMessage}`;
            window.open(whatsappUrl, '_blank');
        }

        window.onload = function() {
            renderProducts();
        };
    </script>
</body>
</html>
